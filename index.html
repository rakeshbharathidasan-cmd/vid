<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VID</title>
<meta name="theme-color" content="#07061a">
<meta name="color-scheme" content="dark only">
<meta name="darkreader-lock">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
/* One-column phone app behind a fingerprint/PIN lock. Capture = orbit of years + on-this-day + form;
   Calendar = month grid with since/repeat counts; List = filter/classify; Stats. Single committed dark look: midnight + aurora. */
:root{
  color-scheme:dark;
  --bg:#07061a; --s1:#100e2a; --s2:#18153a; --s3:#221e4d; --line:#221f48; --line2:#2f2a63;
  --text:#f2efff; --muted:#a19dc8; --faint:#6a6595;
  --gold:#ffcc66; --rose:#ff7ab6; --vio:#a78bfa; --teal:#2ee6d6; --ok:#4ade80; --bad:#ff6b81;
  --disp:'Unbounded',ui-rounded,system-ui,sans-serif;
  --body:'Nunito Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font:15px/1.45 var(--body);max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 92px);
  background:radial-gradient(700px 420px at 0% -10%,rgba(167,139,250,.18),transparent 60%),radial-gradient(600px 420px at 110% 10%,rgba(255,122,182,.10),transparent 60%),radial-gradient(700px 500px at 50% 115%,rgba(46,230,214,.08),transparent 60%),var(--bg);
  background-attachment:fixed;user-select:none}
body::before,body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;
  background-image:radial-gradient(1.2px 1.2px at 12% 18%,#fff8,transparent),radial-gradient(1px 1px at 72% 12%,#fff7,transparent),radial-gradient(1.4px 1.4px at 38% 62%,#fff6,transparent),radial-gradient(1px 1px at 88% 48%,#fff8,transparent),radial-gradient(1.2px 1.2px at 22% 84%,#fff6,transparent),radial-gradient(1px 1px at 58% 36%,#fff5,transparent),radial-gradient(1.3px 1.3px at 92% 82%,#fff7,transparent);
  animation:tw 5s ease-in-out infinite}
body::after{transform:translate(37px,113px) rotate(9deg);animation-delay:2.5s}
@keyframes tw{50%{opacity:.25}}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--vio);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--text);background:var(--s2);border:1px solid var(--line2);border-radius:13px;padding:11px 12px;width:100%;color-scheme:dark;user-select:text}
textarea{resize:vertical;min-height:84px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:12.5px}

header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:conic-gradient(from 180deg,#ffcc66,#ff7ab6,#a78bfa,#2ee6d6,#ffcc66);box-shadow:0 0 24px -6px rgba(255,204,102,.8)}
.mark svg{width:22px;height:22px;fill:#07061a}
.brand b{font-family:var(--disp);font-weight:800;font-size:22px;letter-spacing:2px;background:linear-gradient(90deg,#ffe0a0,#ff9ccc 50%,#c4b2ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:11.5px;color:var(--faint);margin-top:-2px}
.hr{display:flex;gap:6px}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted);background:var(--s1);border:1px solid var(--line)}

.card{background:linear-gradient(180deg,rgba(24,21,58,.82),rgba(16,14,42,.94));border:1px solid var(--line);border-radius:22px;padding:15px;margin-bottom:12px;position:relative}
.ch{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.ch h3{margin:0;font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:1.2px;text-transform:uppercase}
.lnk{font-size:12.5px;color:#c4b2ff;font-weight:700;padding:4px 2px}
.demo{font-size:12.5px;color:var(--gold);background:rgba(255,204,102,.07);border:1px solid rgba(255,204,102,.25);border-radius:14px;padding:9px 12px;margin-bottom:12px}

/* orbit hero */
.hero{overflow:hidden;padding:12px 12px 14px;background:radial-gradient(320px 260px at 50% 45%,rgba(167,139,250,.2),transparent 70%),linear-gradient(180deg,rgba(24,21,58,.86),rgba(12,10,34,.96));border-color:#2c2760}
.orbit svg{width:100%;height:auto;display:block}
.spin{animation:spin 120s linear infinite;transform-origin:170px 150px}
.spin.r2{animation-duration:160s;animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
.twk{animation:twk 3s ease-in-out infinite}
@keyframes twk{50%{opacity:.45}}
.htxt{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:4px}
.htxt .d{font-family:var(--disp);font-weight:700;font-size:19px;line-height:1.2}
.htxt .s{font-size:12.5px;color:var(--muted);margin-top:3px}
.htxt .n{text-align:right}
.htxt .n b{display:block;font-family:var(--disp);font-weight:800;font-size:28px;background:linear-gradient(90deg,#ffe0a0,#ff9ccc);-webkit-background-clip:text;background-clip:text;color:transparent}
.htxt .n span{font-size:11.5px;color:var(--muted)}

/* on this day */
.otd{border-color:rgba(255,204,102,.35);background:radial-gradient(260px 160px at 100% 0%,rgba(255,204,102,.14),transparent 70%),linear-gradient(180deg,rgba(24,21,58,.86),rgba(16,14,42,.95))}
.otd .ch h3{color:var(--gold)}
.ev{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:11px;width:100%;text-align:left;padding:10px 12px 10px 0;border-radius:15px;background:rgba(7,6,26,.45);border:1px solid var(--line);margin-bottom:7px;overflow:hidden}
.ev .bar{background:var(--c);box-shadow:0 0 12px var(--c);border-radius:0 4px 4px 0}
.ev .t{font-size:14.5px;font-weight:700;line-height:1.3;overflow-wrap:anywhere}
.ev .m{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:11.5px;color:var(--muted);margin-top:4px;align-items:center}
.ev .r{text-align:right;font-size:11.5px;color:var(--muted);white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.ev .r b{font-family:var(--disp);font-weight:700;font-size:15px;color:var(--text)}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:700;color:var(--c,var(--muted));background:color-mix(in srgb,var(--c,#a19dc8) 14%,transparent);border:1px solid color-mix(in srgb,var(--c,#a19dc8) 32%,transparent);white-space:nowrap}
.stars{color:var(--gold);font-size:11.5px;letter-spacing:1px}
.ago{font-family:var(--disp);font-weight:700;font-size:11px;color:var(--gold);letter-spacing:.5px}
.cnt{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.cnt div{background:rgba(7,6,26,.5);border:1px solid var(--line);border-radius:11px;padding:6px 9px;font-size:11px;color:var(--muted)}
.cnt b{display:block;font-family:var(--disp);font-size:15px;font-weight:700;color:var(--text)}
.cnt .rep b{color:var(--teal)}

.classify{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:16px;background:linear-gradient(90deg,rgba(167,139,250,.18),rgba(255,122,182,.1));border:1px solid rgba(167,139,250,.4);margin-bottom:12px}
.classify b{font-family:var(--disp);font-size:22px;color:#d6c9ff}
.classify span{font-size:13px;color:var(--muted)}

/* form */
.lbl{font-size:12px;color:var(--muted);margin:12px 0 6px 2px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:99px;background:var(--s2);border:1px solid var(--line2);font-size:13.5px;font-weight:700;color:var(--muted)}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.chip.on{color:var(--text);border-color:var(--c,#a78bfa);background:color-mix(in srgb,var(--c,#a78bfa) 18%,var(--s2));box-shadow:0 0 16px -6px var(--c,#a78bfa)}
.chip.add{border-style:dashed}
.pickbtn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;background:var(--s2);border:1px solid var(--line2);border-radius:13px;padding:11px 12px;min-height:46px}
.pickbtn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.starin{display:flex;gap:4px}
.starin button{font-size:30px;line-height:1;color:#332e66;padding:2px}
.starin button.on{color:var(--gold);text-shadow:0 0 12px rgba(255,204,102,.7)}
.btn{display:block;width:100%;padding:13px;border-radius:14px;background:var(--s2);border:1px solid var(--line2);font-weight:800;text-align:center}
.btn:active{transform:scale(.98)}
.btn.pri{background:linear-gradient(135deg,#ffd27a,#ff8cc0 50%,#a78bfa);border:0;color:#07061a;box-shadow:0 8px 28px -12px rgba(255,140,192,.9)}
.btn.danger{color:var(--bad);border-color:rgba(255,107,129,.35)}
.btn.armed{background:rgba(255,107,129,.16);border-color:var(--bad)}
.btn.sm{padding:9px 12px;font-size:13px;width:auto;display:inline-block;border-radius:11px}
.acts{display:flex;gap:8px;margin-top:12px}
.acts .btn{flex:1;white-space:nowrap;padding-inline:8px}
.note{font-size:12px;color:var(--faint);margin-top:10px;line-height:1.45}
.burst{position:fixed;left:50%;top:45%;width:0;height:0;pointer-events:none;z-index:30}
.burst i{position:absolute;width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 12px var(--c);animation:fly 1.1s cubic-bezier(.15,.8,.3,1) forwards}
.burst b{position:absolute;left:-90px;top:-20px;width:180px;text-align:center;font-family:var(--disp);font-weight:800;font-size:18px;color:#fff;text-shadow:0 0 18px rgba(255,204,102,.9);animation:pop 1.3s ease-out forwards}
@keyframes fly{from{transform:translate(0,0) scale(1.4);opacity:1}to{transform:translate(var(--x),var(--y)) scale(.2);opacity:0}}
@keyframes pop{0%{transform:scale(.4);opacity:0}25%{transform:scale(1.1);opacity:1}100%{transform:translateY(-40px);opacity:0}}

/* calendar */
.pnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.pnav h2{margin:0;font-family:var(--disp);font-weight:700;font-size:18px;text-align:center}
.pnav h2 small{display:block;font-family:var(--body);font-weight:600;font-size:12px;color:var(--muted)}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;background:var(--s1);border:1px solid var(--line);margin-bottom:12px}
.seg button{padding:9px;border-radius:10px;font-weight:800;color:var(--muted);font-size:13.5px}
.seg button.on{color:#07061a;background:linear-gradient(135deg,#ffd27a,#ff8cc0 55%,#c4b2ff)}
.dow,.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.dow div{text-align:center;font-size:11px;color:var(--faint);padding-bottom:4px}
.dc{aspect-ratio:1/1.12;border-radius:12px;background:var(--s1);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 2px 6px;min-width:0;position:relative}
.dc.blank{background:transparent;border:0}
.dc .n{font-size:12px;color:var(--muted);font-weight:700}
.dc.has{background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--c) 30%,transparent),var(--s1) 75%);border-color:color-mix(in srgb,var(--c) 55%,transparent)}
.dc.has .n{color:#fff}
.dc.ann{box-shadow:inset 0 0 0 1px rgba(255,204,102,.45)}
.dc.today{outline:2px solid var(--gold);outline-offset:1px}
.dc.sel{background:color-mix(in srgb,var(--vio) 30%,var(--s1));border-color:var(--vio)}
.dc .dots{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;max-width:100%}
.dc .dots i{width:6px;height:6px;border-radius:50%;background:var(--c);box-shadow:0 0 6px var(--c)}
.dc .an{position:absolute;top:3px;right:4px;font-size:8px;color:var(--gold)}
.calleg{display:flex;flex-wrap:wrap;gap:5px 12px;font-size:11.5px;color:var(--muted);margin-top:10px}
.calleg span{display:inline-flex;align-items:center;gap:5px}
.calleg i{width:9px;height:9px;border-radius:50%}
.selhd{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-bottom:10px}
.selhd .d{font-family:var(--disp);font-weight:700;font-size:18px}
.rep{font-size:12px;color:var(--teal);font-weight:700;text-align:right}
.rep b{display:block;font-family:var(--disp);font-size:18px}
.sub{font-size:11px;color:var(--faint);font-weight:800;letter-spacing:.8px;text-transform:uppercase;margin:12px 2px 7px}
.yr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.ym{padding:8px;border-radius:14px;background:var(--s1);border:1px solid var(--line);text-align:left;min-width:0}
.ym b{font-size:12px;font-weight:800;display:flex;justify-content:space-between}
.ym b span{color:var(--gold)}
.ym .g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-top:5px}
.ym .g i{aspect-ratio:1;border-radius:2px;background:#1a1740}
.ym .g i.e{background:transparent}
.ym .g i.h{background:var(--c);box-shadow:0 0 5px var(--c)}
.ym .g i.t{outline:1px solid var(--gold)}

/* list */
.search{position:relative;margin-bottom:10px}
.search input{padding-left:38px}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--faint)}
.fl{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 8px;padding:0 16px 2px}
.fl::-webkit-scrollbar{display:none}
.fc{flex:none;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:99px;background:var(--s1);border:1px solid var(--line);font-size:12.5px;color:var(--muted);font-weight:700;white-space:nowrap}
.fc i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.fc.on{color:var(--text);border-color:var(--c,#a78bfa);background:color-mix(in srgb,var(--c,#a78bfa) 16%,var(--s1))}
.count{font-size:12.5px;color:var(--muted);margin:2px 2px 10px;display:flex;justify-content:space-between;gap:8px}
.count button{color:#c4b2ff;font-weight:700}
.mh{font-family:var(--disp);font-weight:700;font-size:13px;color:var(--muted);margin:16px 2px 8px;display:flex;justify-content:space-between}
.sugg{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:99px;font-size:11.5px;font-weight:800;color:var(--c);border:1px dashed color-mix(in srgb,var(--c) 60%,transparent);background:color-mix(in srgb,var(--c) 8%,transparent)}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:12px}
.kpi{background:rgba(7,6,26,.5);border:1px solid var(--line);border-radius:15px;padding:10px 12px;min-width:0}
.kpi .k{font-size:11.5px;color:var(--muted)}
.kpi .v{font-family:var(--disp);font-weight:700;font-size:21px;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .v small{font-size:12px;color:var(--muted);font-family:var(--body)}
.kpi .s{font-size:11px;color:var(--faint)}
.cbar{margin:9px 0;display:block;width:100%;text-align:left}
.cbar .row{display:flex;justify-content:space-between;gap:8px;font-size:13px;white-space:nowrap}
.cbar .row span:first-child{display:flex;align-items:center;gap:7px;font-weight:700}
.cbar .row i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.cbar .tr{height:8px;border-radius:8px;background:var(--s3);margin-top:5px;overflow:hidden}
.cbar .tr b{display:block;height:100%;border-radius:8px;background:var(--c)}
.chart svg{width:100%;height:auto;display:block}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;background:rgba(7,6,26,.9);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 10px calc(env(safe-area-inset-bottom,0px) + 6px)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--faint);padding:6px 0;font-weight:700}
nav button.on{color:var(--text)}
nav button.on .ic{color:var(--gold);filter:drop-shadow(0 0 6px rgba(255,204,102,.7))}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(2,1,10,.7);z-index:10;display:none;backdrop-filter:blur(2px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:560px;margin:0 auto;max-height:90vh;overflow:auto;background:linear-gradient(180deg,#191540,#0e0c28);border:1px solid var(--line2);border-bottom:0;border-radius:24px 24px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateY(105%);visibility:hidden;transition:transform .25s cubic-bezier(.2,.9,.3,1),visibility 0s .25s;user-select:text}
.open .scrim{display:block}
.open .sheet{transform:none;visibility:visible;transition:transform .25s cubic-bezier(.2,.9,.3,1)}
.grab{width:42px;height:4px;border-radius:4px;background:var(--line2);margin:0 auto 12px}
.sheet h3{margin:0 0 12px;font-family:var(--disp);font-weight:700;font-size:19px}
.sheet h4{margin:16px 0 7px;font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;font-weight:800}
.vt{font-size:19px;font-weight:800;line-height:1.3;margin:6px 0 4px;white-space:pre-wrap;overflow-wrap:anywhere}
.ts{font-size:11.5px;color:var(--faint);margin-top:12px;line-height:1.6}
.pkq{position:sticky;top:-16px;z-index:2;background:#171339;padding:2px 0 10px}
.pkh{font-size:11px;font-weight:800;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);margin:12px 2px 6px}
.pkr{display:grid;grid-template-columns:1fr 40px 40px;align-items:center;gap:2px;border-bottom:1px solid var(--line)}
.pkr .nm{text-align:left;padding:12px 4px;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pkr .nm.sel{color:var(--gold);font-weight:800}
.pkr .ib{height:40px;border-radius:10px;font-size:19px;color:var(--faint);display:grid;place-items:center}
.pkr .ib.fav{color:var(--gold)}
.pkr .ib.del{font-size:15px}
.pkr .ib.armed{background:rgba(255,107,129,.16);color:var(--bad);font-size:11px;font-weight:800}
.pkadd{display:block;width:100%;text-align:left;padding:12px;margin-top:8px;border-radius:12px;border:1px dashed var(--line2);color:var(--rose);font-weight:700}
.catrow{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:9px 10px;border-radius:14px;background:var(--s1);border:1px solid var(--line);margin-bottom:7px}
.catrow .cd{width:30px;height:30px;border-radius:10px;background:var(--c);box-shadow:0 0 12px -3px var(--c)}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.sw button{width:32px;height:32px;border-radius:50%;background:var(--c);border:3px solid transparent}
.sw button.on{border-color:#fff}
.opt3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}

/* lock */
#lock{position:fixed;inset:0;z-index:50;background:radial-gradient(500px 400px at 50% 30%,rgba(167,139,250,.22),transparent 70%),var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px calc(env(safe-area-inset-bottom,0px) + 24px);user-select:none}
.orbw{position:relative;width:120px;height:120px;margin-bottom:18px}
.orb{width:120px;height:120px;border-radius:50%;position:relative;background:conic-gradient(from 0deg,#ffcc66,#ff7ab6,#a78bfa,#2ee6d6,#ffcc66);animation:spin 6s linear infinite;box-shadow:0 0 60px -10px rgba(255,140,192,.8)}
.orb::after{content:"";position:absolute;inset:5px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#221d55,#07061a 70%)}
.orbt{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--disp);font-weight:800;font-size:28px;letter-spacing:3px;pointer-events:none;background:linear-gradient(90deg,#ffe0a0,#ff9ccc,#c4b2ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#lock h2{margin:0;font-family:var(--disp);font-weight:700;font-size:18px;text-align:center}
#lock p{color:var(--muted);text-align:center;margin:6px 0 16px;font-size:13.5px;max-width:300px}
.pins{display:flex;gap:12px;margin-bottom:18px}
.pins i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line2);transition:.15s}
.pins i.on{background:var(--gold);border-color:var(--gold);box-shadow:0 0 10px var(--gold)}
.pins.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:12px}
.pad button{height:62px;border-radius:50%;background:var(--s1);border:1px solid var(--line2);font-family:var(--disp);font-weight:700;font-size:22px}
.pad button:active{background:var(--s3)}
.pad .fp{color:var(--teal);font-size:12px;font-family:var(--body);font-weight:800}
.pad .fp .ic{width:28px;height:28px}
.lockerr{color:var(--bad);font-size:13px;min-height:20px;margin:-6px 0 8px;text-align:center}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 86px);transform:translate(-50%,16px);width:min(92vw,440px);display:flex;align-items:center;justify-content:space-between;gap:12px;background:#221d55;border:1px solid var(--line2);padding:11px 14px;border-radius:16px;font-size:13.5px;opacity:0;transition:.22s;pointer-events:none;z-index:60}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{color:var(--gold);font-weight:800;white-space:nowrap}
@media (prefers-reduced-motion:reduce){body::before,body::after,.spin,.twk,.orb,.burst{animation:none!important}}
</style>
</head>
<body>
<div id="lock" hidden></div>
<div id="app" hidden>
<header>
  <div class="brand"><div class="mark"><svg viewBox="0 0 24 24"><path d="M12 2.5l2.6 6.2 6.7.5-5.1 4.4 1.6 6.6L12 16.6l-5.8 3.6 1.6-6.6-5.1-4.4 6.7-.5z"/></svg></div>
    <div><b>VID</b><small>Very important days</small></div></div>
  <div class="hr">
    <button class="icon-btn" data-act="lock" aria-label="Lock now"><svg class="ic" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2.5"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></button>
    <button class="icon-btn" data-act="settings" aria-label="Settings"><svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
  </div>
</header>
<main id="view"></main>
<nav><div class="in">
  <button data-act="tab" data-t="cap"><svg class="ic" viewBox="0 0 24 24"><path d="M12 2.5l2.6 6.2 6.7.5-5.1 4.4 1.6 6.6L12 16.6l-5.8 3.6 1.6-6.6-5.1-4.4 6.7-.5z"/></svg>Capture</button>
  <button data-act="tab" data-t="cal"><svg class="ic" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Calendar</button>
  <button data-act="tab" data-t="list"><svg class="ic" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>List</button>
  <button data-act="tab" data-t="stats"><svg class="ic" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Stats</button>
</div></nav>
</div>
<div id="sheetWrap"><div class="scrim" data-act="close"></div><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"><span id="toastMsg"></span><button id="toastBtn" hidden></button></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
(() => {
'use strict';
/* ===================== storage ===================== */
const KEY = 'vid.v1', LKEY = 'vid.lock', DAY = 86400000;
const SWATCH = ['#ff7ab6','#4ade80','#60a5fa','#fbbf24','#2ee6d6','#a78bfa','#fb923c','#f472b6','#facc15','#34d399','#c084fc','#ff6b81'];
const DEF_CATS = [['personal','Personal','#ff7ab6'],['investment','Investment','#4ade80'],['career','Career','#60a5fa'],['family','Family','#fbbf24'],['fitness','Fitness','#2ee6d6']].map(([id,name,color]) => ({id,name,color}));
const UNC = {id:null, name:'Unclassified', color:'#8b87b8'};
const fresh = () => ({cats:DEF_CATS.map(c => ({...c})), entries:[], subs:{}, subFav:{}});
const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v ?? d; } catch(e) { return d; } };
let S = {...fresh(), ...load(KEY, {})};
let L = {pinHash:null, salt:null, cred:null, grace:1, ...load(LKEY, {})};
let warned = false;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) { if (!warned) { warned = true; toast('Could not save on this device'); } } };
const saveL = () => { try { localStorage.setItem(LKEY, JSON.stringify(L)); } catch(e) {} };
const UI = {tab:'cap', calM:null, sel:null, calMode:'month', yr:null, f:{cat:'all', sub:null, yr:null, q:'', sort:'new'}, F:null};

/* ===================== helpers ===================== */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,'0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const kDate = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y, m-1, d); };
const dnum = k => { const [y,m,d] = k.split('-').map(Number); return Date.UTC(y, m-1, d)/DAY; };
const today = () => iso(new Date());
const md = k => k.slice(5);
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const nice = k => { const d = kDate(k); return `${DOW[d.getDay()]}, ${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const short = k => { const d = kDate(k); return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}`; };
const dm = k => { const d = kDate(k); return `${d.getDate()} ${MON[d.getMonth()]}`; };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const catOf = id => id ? (S.cats.find(c => c.id === id) || {id, name:id, color:'#8b87b8'}) : UNC;
const ent = id => S.entries.find(e => e.id === id);
const dispC = e => e.cat ? catOf(e.cat).color : e.sug ? catOf(e.sug).color : UNC.color;   // unclassified days glow in their suggested colour
const fmtN = n => n.toLocaleString('en-IN');
const leap = y => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;
const stamp = t => { const d = new Date(t); return `${d.getDate()} ${MON[d.getMonth()]} ${d.getFullYear()}, ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
/* days since the event, and days until its month-day next comes round (0 = today) */
const since = k => dnum(today()) - dnum(k);
function nextRepeat(mdv){
  const t = today(), y = +t.slice(0,4);
  const at = yy => { let m = mdv; if (m === '02-29' && !leap(yy)) m = '02-28'; return `${yy}-${m}`; };
  let k = at(y); if (k < t) k = at(y + 1);
  return {k, n: dnum(k) - dnum(t)};
}
const yearsAgo = k => { const n = +today().slice(0,4) - +k.slice(0,4); return n; };
const durTxt = n => { const a = Math.abs(n); if (a < 31) return `${fmtN(a)} day${a === 1 ? '' : 's'}`; const y = Math.floor(a/365.25), m = Math.floor((a - y*365.25)/30.44); return `${fmtN(a)} days` + (y || m ? ` · ${y ? y + 'y ' : ''}${m ? m + 'm' : ''}`.trimEnd() : ''); };
const starStr = n => n ? '★'.repeat(n) : '';
const sorted = arr => arr.slice().sort((a,b) => a.date < b.date ? 1 : a.date > b.date ? -1 : (b.created||0) - (a.created||0));

/* ===================== lock ===================== */
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64 = s => Uint8Array.from(atob(s.replace(/-/g,'+').replace(/_/g,'/') + '==='.slice((s.length + 3) % 4)), c => c.charCodeAt(0));
const rand = n => crypto.getRandomValues(new Uint8Array(n));
async function hashPin(pin, salt){ const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(salt + ':' + pin)); return b64(d); }
async function bioAvailable(){ try { return !!(window.PublicKeyCredential && await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable()); } catch(e) { return false; } }
async function bioRegister(){
  const c = await navigator.credentials.create({publicKey:{challenge:rand(32), rp:{name:'VID'}, user:{id:rand(16), name:'vid-owner', displayName:'VID'},
    pubKeyCredParams:[{type:'public-key', alg:-7},{type:'public-key', alg:-257}], authenticatorSelection:{authenticatorAttachment:'platform', userVerification:'required', residentKey:'discouraged'}, timeout:60000, attestation:'none'}});
  L.cred = b64(c.rawId); saveL();
}
async function bioCheck(){
  await navigator.credentials.get({publicKey:{challenge:rand(32), allowCredentials:[{type:'public-key', id:unb64(L.cred), transports:['internal']}], userVerification:'required', timeout:60000}});
}
let LK = {mode:null, buf:'', first:'', fails:0, until:0};
function showLock(mode){
  LK = {...LK, mode, buf:'', first:''};
  closeSheet(); $('app').hidden = true; $('lock').hidden = false; renderLock();
  if (mode === 'unlock' && L.cred) setTimeout(tryBio, 350);
}
function renderLock(msg = ''){
  const m = LK.mode, title = m === 'setup1' ? 'Create your PIN' : m === 'setup2' ? 'Confirm your PIN' : m === 'change1' ? 'Enter a new PIN' : 'Unlock VID';
  const sub = m === 'setup1' ? 'Choose a 6-digit PIN. It unlocks VID when your fingerprint isn\'t handy.' : m === 'setup2' ? 'Type the same 6 digits again.' : m === 'change1' ? 'Your new 6-digit PIN.' : L.cred ? 'Touch the fingerprint sensor, or enter your PIN.' : 'Enter your 6-digit PIN.';
  $('lock').innerHTML = `<div class="orbw"><div class="orb"></div><div class="orbt">VID</div></div><h2>${title}</h2><p>${sub}</p>
    <div class="pins" id="pins">${[0,1,2,3,4,5].map(i => `<i class="${i < LK.buf.length ? 'on' : ''}"></i>`).join('')}</div>
    <div class="lockerr" id="lockerr">${msg}</div>
    <div class="pad">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-pin="${n}">${n}</button>`).join('')}
      ${m === 'unlock' && L.cred ? `<button class="fp" data-pin="bio" aria-label="Use fingerprint"><svg class="ic" viewBox="0 0 24 24"><path d="M12 11v3a8 8 0 0 1-2 5.3M8.5 8.5A4 4 0 0 1 16 11v1.5M5 12a7 7 0 0 1 12.6-4.2M19 12v1.5a12 12 0 0 1-1 4.8M12 21.5a11 11 0 0 0 1.8-3.5M8 14.5a14 14 0 0 1-.8 3"/></svg></button>` : '<span></span>'}
      <button data-pin="0">0</button><button data-pin="del" aria-label="Delete">⌫</button></div>
    ${LK.next === 'change1' && m !== 'unlock' ? '<button class="lnk" style="margin-top:16px" data-pin="cancel">Cancel and keep my current PIN</button>' : ''}
    ${window.VID_DEMO && m === 'unlock' ? '<p class="small" style="color:var(--gold);margin-top:14px">Preview PIN: 1 2 3 4 5 6</p>' : ''}`;
}
async function tryBio(){
  if (!L.cred || LK.mode !== 'unlock') return;
  try { await bioCheck(); unlock(); } catch(e) { const el = $('lockerr'); if (el) el.textContent = 'Fingerprint not confirmed. Use your PIN, or tap the fingerprint button to try again.'; }
}
async function pinKey(k){
  if (k === 'bio') return tryBio();
  if (k === 'cancel') { LK.next = null; return unlock(); }
  if (Date.now() < LK.until) return renderLock(`Too many tries. Wait ${Math.ceil((LK.until - Date.now())/1000)}s.`);
  if (k === 'del') { LK.buf = LK.buf.slice(0,-1); return renderLock(); }
  if (LK.buf.length >= 6) return;
  LK.buf += k; renderLock();
  if (LK.buf.length < 6) return;
  const pin = LK.buf;
  if (LK.mode === 'setup1' || LK.mode === 'change1') { LK.first = pin; LK.buf = ''; LK.next = LK.mode; LK.mode = 'setup2'; return setTimeout(() => renderLock(), 150); }
  if (LK.mode === 'setup2') {
    if (pin !== LK.first) { LK.buf = ''; LK.mode = LK.next || 'setup1'; return setTimeout(() => { renderLock('The two PINs didn\'t match. Start again.'); $('pins').classList.add('shake'); }, 150); }
    L.salt = b64(rand(16)); L.pinHash = await hashPin(pin, L.salt); saveL();
    const wasChange = LK.next === 'change1';
    unlock();
    LK.next = null;
    if (wasChange) toast('PIN changed'); else setTimeout(offerBio, 400);
    return;
  }
  if (await hashPin(pin, L.salt) === L.pinHash) { LK.fails = 0; unlock(); }
  else { LK.fails++; LK.buf = ''; if (LK.fails >= 5) { LK.until = Date.now() + 30000; LK.fails = 0; }
    setTimeout(() => { renderLock(LK.until > Date.now() ? 'Too many wrong tries. Wait 30 seconds.' : 'Wrong PIN. Try again.'); $('pins').classList.add('shake'); }, 120); }
}
let unlocked = false, hiddenAt = 0;
function unlock(){ unlocked = true; $('lock').hidden = true; $('app').hidden = false; render(); }
async function offerBio(){
  const ok = await bioAvailable();
  sheet(`<h3>Use your fingerprint?</h3><p class="muted" style="margin-top:-4px">Unlock VID with the fingerprint or face unlock already set up on this phone. Your PIN keeps working as a backup.</p>
    ${ok ? '<button class="btn pri" data-act="bioon">Turn on fingerprint unlock</button>' : '<div class="note" style="color:var(--gold)">This browser doesn\'t offer fingerprint unlock here. Open VID from your home screen in Chrome or Samsung Internet and turn it on in Settings.</div>'}
    <div class="acts"><button class="btn" data-act="close">${ok ? 'Not now' : 'OK'}</button></div>`);
}
document.addEventListener('visibilitychange', () => {
  if (!L.pinHash) return;
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (unlocked && hiddenAt && Date.now() - hiddenAt >= L.grace * 60000) { unlocked = false; showLock('unlock'); }
  else if (unlocked) render();
});
$('lock').addEventListener('click', e => { const b = e.target.closest('[data-pin]'); if (b) pinKey(b.dataset.pin); });
document.addEventListener('keydown', e => { if (!$('lock').hidden) { if (/^\d$/.test(e.key)) pinKey(e.key); else if (e.key === 'Backspace') pinKey('del'); } });

/* ===================== render ===================== */
function render(){
  if (!unlocked) return;
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === UI.tab));
  const demo = window.VID_DEMO ? '<div class="demo">Preview with made-up sample days. Your real days load from the import file on your phone.</div>' : '';
  $('view').innerHTML = demo + ({cap:renderCap, cal:renderCal, list:renderList, stats:renderStats}[UI.tab])();
}

/* ---------- orbit: each year is a ring, each important day a star at its day-of-year angle ---------- */
function orbitSVG(){
  const years = [...new Set(S.entries.map(e => +e.date.slice(0,4)))].sort().slice(-5), cx = 170, cy = 150;
  const ty = new Date(), doy = (Date.UTC(ty.getFullYear(), ty.getMonth(), ty.getDate()) - Date.UTC(ty.getFullYear(), 0, 0))/DAY, tA = doy/365.25*2*Math.PI - Math.PI/2;
  let rings = '', stars = '', labels = '';
  const R = i => 42 + i * (100 / Math.max(1, years.length));
  years.forEach((y, i) => {
    const r = R(i) + 12;
    rings += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#2c2766" stroke-width="1" stroke-dasharray="2 4"/>`;
    labels += `<text x="${cx + r + 3}" y="${cy + 3}" font-size="8.5" fill="#6a6595" font-family="Nunito Sans,system-ui">${String(y).slice(2)}</text>`;
    S.entries.filter(e => +e.date.slice(0,4) === y).forEach((e, j) => {
      const d = kDate(e.date), dy = (Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - Date.UTC(d.getFullYear(), 0, 0))/DAY, a = dy/365.25*2*Math.PI - Math.PI/2;
      const x = cx + r*Math.cos(a), yy = cy + r*Math.sin(a), c = dispC(e), s = 1.8 + (e.stars || 0) * .45;
      stars += `<circle cx="${x.toFixed(1)}" cy="${yy.toFixed(1)}" r="${(s*2.6).toFixed(1)}" fill="${c}" opacity=".18"/><circle class="${j % 3 === 0 ? 'twk' : ''}" style="animation-delay:${(j % 7) * .4}s" cx="${x.toFixed(1)}" cy="${yy.toFixed(1)}" r="${s.toFixed(1)}" fill="${c}"/>`;
    });
  });
  const rmax = (years.length ? R(years.length - 1) : 42) + 22;
  const tx = cx + rmax*Math.cos(tA), tyy = cy + rmax*Math.sin(tA);
  return `<svg viewBox="0 0 340 300" role="img" aria-label="Your important days on yearly orbits">
    <defs><radialGradient id="core"><stop offset="0" stop-color="#ffe0a0"/><stop offset=".5" stop-color="#ff8cc0" stop-opacity=".6"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient></defs>
    <circle cx="${cx}" cy="${cy}" r="34" fill="url(#core)" class="twk"/>
    <text x="${cx}" y="${cy + 5}" text-anchor="middle" font-family="Unbounded,system-ui" font-weight="800" font-size="15" fill="#07061a">VID</text>
    ${rings}${labels}
    <line x1="${cx}" y1="${cy}" x2="${tx.toFixed(1)}" y2="${tyy.toFixed(1)}" stroke="#ffcc66" stroke-width="1.4" stroke-dasharray="3 3" opacity=".8"/>
    <circle cx="${tx.toFixed(1)}" cy="${tyy.toFixed(1)}" r="4" fill="#ffcc66"/><text x="${tx.toFixed(1)}" y="${(tyy - 8).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="800" fill="#ffcc66" font-family="Nunito Sans,system-ui">today</text>
    <g class="spin" style="transform-origin:${cx}px ${cy}px">${stars}</g>
  </svg>`;
}

/* ---------- CAPTURE ---------- */
function renderCap(){
  const t = today(), unc = S.entries.filter(e => !e.cat).length;
  let h = `<section class="card hero"><div class="orbit">${orbitSVG()}</div>
    <div class="htxt"><div><div class="d">${nice(t)}</div><div class="s">Each ring is a year. Each star is an important day, placed on its date.</div></div>
      <div class="n"><b class="num">${fmtN(S.entries.length)}</b><span>days marked</span></div></div></section>`;
  // On this day: every past year
  const same = sorted(S.entries.filter(e => md(e.date) === md(t) && e.date < t));
  if (same.length) h += `<section class="card otd"><div class="ch"><h3>✦ On this day · ${dm(t)}</h3><span class="small muted">${same.length} from past years</span></div>${same.map(e => evRow(e, 'ago')).join('')}</section>`;
  else {
    const up = upcoming(1)[0];
    if (up) h += `<section class="card otd"><div class="ch"><h3>✦ Next anniversary</h3><span class="small muted">${up.n === 1 ? 'tomorrow' : `in ${up.n} days`}</span></div>${evRow(up.e, 'ago')}</section>`;
  }
  if (!S.entries.length) h += `<button class="classify" data-act="import"><b>⇪</b><span><b style="font-size:15px;display:block;color:var(--text);font-family:var(--body)">Load your past important days</b>Pick the vid-past-days.json file saved on your phone.</span></button>`;
  if (unc) h += `<button class="classify" data-act="gounc"><b class="num">${unc}</b><span><b style="font-size:15px;display:block;color:var(--text);font-family:var(--body)">days to classify</b>Your past days have suggested categories. Tap to confirm them one by one.</span></button>`;
  h += captureForm();
  const up = upcoming(30).filter(x => x.n > 0).slice(0, 6);
  if (up.length) h += `<section class="card"><div class="ch"><h3>Coming up · 30 days</h3></div>${up.map(x => evRow(x.e, 'ago', x.n)).join('')}</section>`;
  const rec = S.entries.slice().sort((a,b) => (b.created||0) - (a.created||0)).filter(e => !e.imported).slice(0, 5);
  if (rec.length) h += `<section class="card"><div class="ch"><h3>Recently captured</h3><button class="lnk" data-act="tab" data-t="list">All ›</button></div>${rec.map(e => evRow(e)).join('')}</section>`;

const kpi = (k, v, s = '') => `<div class="kpi"><div class="k">${k}</div><div class="v num">${v}</div><div class="s">${s}</div></div>`;

    cats.forEach(c => { const n = S.entries.filter(e => e.date.startsWith(y) && (e.cat || null) === c.id).length; if (!n) return; const hh = n/mx*(base - top); yy -= hh; g += `<rect x="${x.toFixed(1)}" y="${yy.toFixed(1)}" width="${w.toFixed(1)}" height="${(hh - .8).toFixed(1)}" fill="${c.color}" rx="3"/>`; });
    g += `<text x="${(x + w/2).toFixed(1)}" y="${(yy - 5).toFixed(1)}" text-anchor="middle" font-size="11" font-weight="800" fill="#f2efff" font-family="Nunito Sans,system-ui">${tot(y)}</text>
      <text x="${(x + w/2).toFixed(1)}" y="${H - 4}" text-anchor="middle" font-size="11" fill="#a19dc8" font-family="Nunito Sans,system-ui">${y}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Important days per year">${g}<line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="#2f2a63"/></svg>`;
}
function monthBars(byM){
  const W = 340, H = 120, base = H - 18, top = 14, bw = W/12, mx = Math.max(1, ...byM);
  let g = '';
  byM.forEach((n, i) => { const x = i*bw + bw*.18, w = bw*.64, hh = n/mx*(base - top);
    if (n) g += `<rect x="${x.toFixed(1)}" y="${(base - hh).toFixed(1)}" width="${w.toFixed(1)}" height="${hh.toFixed(1)}" rx="3" fill="url(#mg)"/><text x="${(x + w/2).toFixed(1)}" y="${(base - hh - 4).toFixed(1)}" text-anchor="middle" font-size="9.5" fill="#f2efff" font-family="Nunito Sans,system-ui">${n}</text>`;
    g += `<text x="${(x + w/2).toFixed(1)}" y="${H - 4}" text-anchor="middle" font-size="9.5" fill="#a19dc8" font-family="Nunito Sans,system-ui">${MON[i][0]}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Important days by month"><defs><linearGradient id="mg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffcc66"/><stop offset="1" stop-color="#ff7ab6"/></linearGradient></defs>${g}<line x1="0" x2="${W}" y1="${base}" y2="${base}" stroke="#2f2a63"/></svg>`;
}

/* ===================== sheets ===================== */
function sheet(h){ $('sheet').innerHTML = `<div class="grab"></div>${h}`; document.body.classList.add('open'); $('sheet').scrollTop = 0; }
function closeSheet(){ document.body.classList.remove('open'); UI.inSheet = false; }
function sheetView(id){
  const e = ent(id); if (!e) return;
  const c = catOf(e.cat), s = since(e.date), r = nextRepeat(md(e.date)), others = sorted(S.entries.filter(x => x.id !== e.id && md(x.date) === md(e.date)));
  sheet(`<div style="display:flex;gap:6px;flex-wrap:wrap"><span class="tag" style="--c:${c.color}">${esc(c.name)}${e.sub ? ' · ' + esc(e.sub) : ''}</span>${e.stars ? `<span class="stars" style="font-size:15px">${starStr(e.stars)}</span>` : ''}</div>
    <div class="vt">${esc(e.text)}</div><div class="ago" style="font-size:12px">${nice(e.date)}${e.end ? ` → ${nice(e.end)}` : ''}</div>
    <div class="cnt" style="margin-top:12px"><div>${s >= 0 ? 'Days since' : 'Days to go'}<b class="num">${fmtN(Math.abs(s))}</b>${durTxt(s).split(' · ')[1] || ''}</div>
      <div class="rep">Repeats in<b class="num">${r.n === 0 ? 'Today ✦' : fmtN(r.n) + ' days'}</b>next on ${short(r.k)}</div></div>
    ${!e.cat && e.sug ? `<div class="acts"><button class="btn" style="border-color:${catOf(e.sug).color}" data-act="accept" data-id="${e.id}">✓ Classify as ${esc(catOf(e.sug).name)}</button></div>` : ''}
    ${others.length ? `<h4>Also on ${dm(e.date)}</h4>${others.map(x => evRow(x, 'ago')).join('')}` : ''}
    <div class="acts"><button class="btn" data-act="edit" data-id="${e.id}">Edit</button></div>
    <div class="ts">Captured ${e.created ? stamp(e.created) : '—'}${e.imported ? ' · imported from your notes' : ''}${e.updated && e.updated !== e.created ? `<br>Last edited ${stamp(e.updated)}` : ''}</div>`);
}
function sheetEdit(id){
  const e = ent(id); UI.F = {id:e.id, date:e.date, end:e.end || '', cat:e.cat || e.sug || null, sub:e.sub || '', text:e.text, stars:e.stars || 0}; UI.inSheet = true;
  sheet(`<h3>Edit day</h3>${formBody(UI.F)}`);
}
function sheetCat(c){
  const isNew = !c; c = c || {id:'c' + uid(), name:'', color:SWATCH[(S.cats.length + 5) % SWATCH.length]};
  UI.catEdit = {...c, isNew}; const n = S.entries.filter(e => e.cat === c.id).length;
  sheet(`<h3>${isNew ? 'New category' : 'Edit category'}</h3><input id="cName" maxlength="22" value="${esc(c.name)}" placeholder="e.g. Travel, Spiritual, Health">
    <div class="lbl">Colour</div><div class="sw">${SWATCH.map(x => `<button style="--c:${x}" class="${x === c.color ? 'on' : ''}" data-act="catsw" data-c="${x}" aria-label="Colour"></button>`).join('')}</div>
    <button class="btn pri" data-act="savecat">${isNew ? 'Add category' : 'Save'}</button>
    ${!isNew ? `<div class="acts"><button class="btn danger" data-act="delcat">${n ? `Delete (${n} days become unclassified)` : 'Delete category'}</button></div>` : ''}`);
}
async function sheetSettings(){
  const ok = await bioAvailable();
  sheet(`<h3>Settings</h3>
    <h4>Lock</h4>
    ${L.cred ? `<div class="catrow" style="--c:var(--teal)"><span class="cd" style="display:grid;place-items:center;color:#07061a;font-weight:800">✓</span><b>Fingerprint unlock is on</b><button class="lnk" data-act="bioff">Turn off</button></div>`
      : ok ? '<button class="btn" data-act="bioon">Turn on fingerprint unlock</button>' : '<div class="note" style="margin-top:0">Fingerprint unlock works when VID is opened from your home screen in Chrome or Samsung Internet.</div>'}
    <div class="lbl">Lock again after leaving the app</div>
    <div class="opt3">${[[0,'Immediately'],[1,'1 minute'],[5,'5 minutes']].map(([v,l]) => `<button class="chip${L.grace === v ? ' on' : ''}" style="justify-content:center" data-act="grace" data-v="${v}">${l}</button>`).join('')}</div>
    <div class="acts"><button class="btn" data-act="chpin">Change PIN</button></div>
    <h4>Categories</h4>${S.cats.map(c => `<button class="catrow" style="--c:${c.color}" data-act="editcat" data-id="${c.id}"><span class="cd"></span><b>${esc(c.name)}</b><span class="small muted">${S.entries.filter(e => e.cat === c.id).length} days</span></button>`).join('')}
    <button class="btn" data-act="newcat">＋ Add a category</button>
    <h4>Data</h4>
    <button class="btn" data-act="import">Import past days or a backup</button>
    <div class="acts"><button class="btn" data-act="export">Export backup</button></div>
    <div class="note">Everything stays on this phone. Export a backup now and then, keep it out of GitHub, and never use "Clear site data" for github.io: it would wipe all your apps.</div>
    <h4>Reset</h4><button class="btn danger" data-act="wipe">Delete all VID data and PIN</button>`);
}

/* ===================== actions ===================== */
let tt, undoFn = null;
function toast(msg, act){ const t = $('toast'); $('toastMsg').innerHTML = msg; t.classList.add('show'); const b = $('toastBtn');
  if (act) { b.hidden = false; b.textContent = act.label; undoFn = act.fn; } else { b.hidden = true; undoFn = null; }
  clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), act ? 5000 : 2800); }
$('toastBtn').onclick = () => { if (undoFn) undoFn(); $('toast').classList.remove('show'); };
function arm(el, fn){ if (el.classList.contains('armed')) return fn(); el.classList.add('armed'); const t = el.textContent; el.textContent = 'Tap again to confirm'; setTimeout(() => { if (el.isConnected) { el.classList.remove('armed'); el.textContent = t; } }, 3000); }
function burst(color, text){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const b = document.createElement('div'); b.className = 'burst';
  const cols = [color, '#ffcc66', '#ff7ab6', '#a78bfa', '#2ee6d6'];
  b.innerHTML = Array.from({length:26}, (_, i) => { const a = i/26*Math.PI*2, r = 90 + Math.random()*90; return `<i style="--c:${cols[i % cols.length]};--x:${(Math.cos(a)*r).toFixed(0)}px;--y:${(Math.sin(a)*r).toFixed(0)}px;animation-delay:${(Math.random()*.08).toFixed(2)}s"></i>`; }).join('') + `<b>${text}</b>`;
  document.body.appendChild(b); setTimeout(() => b.remove(), 1500);
}
function rerenderForm(){ if (UI.inSheet) sheet(`<h3>Edit day</h3>${formBody(UI.F)}`); else { const c = $('capCard'); if (c) c.outerHTML = captureForm(); else render(); } }
function importData(file){
  if (!file) return; const r = new FileReader();
  r.onload = () => { try {
    const d = JSON.parse(r.result);
    if (d.kind === 'backup' && Array.isArray(d.entries)) {
      const have = new Set(S.entries.map(e => e.id)); let n = 0;
      (d.cats || []).forEach(c => { if (!S.cats.some(x => x.id === c.id)) S.cats.push(c); });
      d.entries.forEach(e => { if (!have.has(e.id)) { S.entries.push(e); n++; } });
      Object.entries(d.subs || {}).forEach(([k,v]) => S.subs[k] = [...new Set([...(S.subs[k] || []), ...v])]);
      Object.entries(d.subFav || {}).forEach(([k,v]) => S.subFav[k] = [...new Set([...(S.subFav[k] || []), ...v])]);
      save(); closeSheet(); render(); return toast(`Backup merged · ${n} days added`);
    }
    if (d.app === 'VID' && Array.isArray(d.entries)) {
      const have = new Set(S.entries.map(e => e.id)), now = Date.now(); let n = 0;
      d.entries.forEach(e => { if (have.has(e.id) || !/^\d{4}-\d{2}-\d{2}$/.test(e.date)) return;
        S.entries.push({id:e.id, date:e.date, end:e.end || '', cat:null, sug:S.cats.some(c => c.id === e.sug) ? e.sug : null, sub:'', text:e.text, stars:0, created:now, updated:now, imported:true}); n++; });
      save(); closeSheet(); render(); burst('#ffcc66', `${n} days loaded`);
      return toast(n ? `${n} past days loaded. Each has a suggested category for you to confirm.` : 'Those days are already in VID.');
    }
    throw 0;
  } catch(e) { toast('That file is not a VID import or backup'); } };
  r.readAsText(file);
}
$('fileIn').onchange = e => { importData(e.target.files[0]); e.target.value = ''; };

const A = {
  tab: el => { UI.tab = el.dataset.t; closeSheet(); render(); scrollTo(0,0); },
  lock: () => { if (L.pinHash) { unlocked = false; showLock('unlock'); } },
  /* capture */
  fcat: el => { readF(); const v = el.dataset.v; if (UI.F.cat !== v) UI.F.sub = ''; UI.F.cat = v; rerenderForm(); },
  fstar: el => { const n = +el.dataset.v; UI.F.stars = UI.F.stars === n ? 0 : n; document.querySelectorAll('#starIn button').forEach((b,i) => b.classList.toggle('on', i < UI.F.stars)); },
  subopen: () => { UI.returnEdit = UI.inSheet; openSub(); },
  pkchoose: el => { UI.F.sub = el.dataset.v; closeSheet(); if (UI.returnEdit) { UI.inSheet = true; sheet(`<h3>Edit day</h3>${formBody(UI.F)}`); } else rerenderForm(); },
  pkfav: el => { const c = UI.F.cat, v = el.dataset.v, a = S.subFav[c] = S.subFav[c] || [], i = a.indexOf(v); if (i >= 0) a.splice(i, 1); else a.push(v); save(); pkRefresh(); },
  pkdel: el => { if (!el.classList.contains('armed')) { el.classList.add('armed'); el.textContent = 'Sure?'; setTimeout(() => { if (el.isConnected) { el.classList.remove('armed'); el.textContent = '🗑'; } }, 3000); return; }
    const c = UI.F.cat, v = el.dataset.v; S.subs[c] = (S.subs[c] || []).filter(x => x !== v); S.subFav[c] = (S.subFav[c] || []).filter(x => x !== v);
    S.subHid = S.subHid || {}; (S.subHid[c] = S.subHid[c] || []).push(v); if (UI.F.sub === v) UI.F.sub = ''; save(); pkRefresh(); toast(`${esc(v)} removed from the list`); },
  pkadd: () => { const v = PK.q.trim().slice(0, 30); if (!v) return; const c = UI.F.cat; (S.subs[c] = S.subs[c] || []).push(v);
    if (S.subHid && S.subHid[c]) S.subHid[c] = S.subHid[c].filter(x => x !== v); save(); A.pkchoose({dataset:{v}}); },
  savef: () => {
    readF(); const F = UI.F;
    if (!F.text.trim()) return toast('Add a quick remark about the day');
    if (!F.cat) return toast('Pick a category');
    if (F.end && F.end <= F.date) F.end = '';
    const now = Date.now();
    if (F.id) { const e = ent(F.id); Object.assign(e, {date:F.date, end:F.end, cat:F.cat, sub:F.sub, text:F.text.trim(), stars:F.stars, updated:now}); delete e.sug; }
    else S.entries.push({id:uid(), date:F.date, end:F.end, cat:F.cat, sub:F.sub, text:F.text.trim(), stars:F.stars, created:now, updated:now});
    if (F.sub) { const a = S.subs[F.cat] = S.subs[F.cat] || []; if (!a.includes(F.sub)) a.push(F.sub); }
    save(); const wasEdit = !!F.id, col = catOf(F.cat).color; UI.F = null; closeSheet();
    if (navigator.vibrate) navigator.vibrate(30);
    render(); burst(col, wasEdit ? 'Saved' : '✦ Marked'); toast(wasEdit ? 'Day updated' : `${dm(F.date)} marked as a very important day`);
  },
  cancelf: () => { UI.F = null; rerenderForm(); },
  capfor: el => { UI.F = blankF(el.dataset.k); UI.tab = 'cap'; render(); setTimeout(() => $('capCard') && $('capCard').scrollIntoView({behavior:'smooth', block:'start'}), 60); },
  view: el => sheetView(el.dataset.id),
  edit: el => sheetEdit(el.dataset.id),
  delent: el => arm(el, () => { const e = ent(el.dataset.id); S.entries = S.entries.filter(x => x.id !== e.id); save(); UI.F = null; closeSheet(); render();
    toast('Day deleted', {label:'Undo', fn:() => { S.entries.push(e); save(); render(); }}); }),
  accept: el => { const e = ent(el.dataset.id); e.cat = e.sug; delete e.sug; e.updated = Date.now(); save(); closeSheet(); render(); toast(`Classified as ${esc(catOf(e.cat).name)}`); },
  setcat: el => { const e = ent(el.dataset.id); e.cat = el.dataset.c; delete e.sug; e.updated = Date.now(); save(); render(); toast(`Classified as ${esc(catOf(e.cat).name)}`); },
  acceptall: el => arm(el, () => { const list = filtered().filter(e => !e.cat && e.sug), now = Date.now(); list.forEach(e => { e.cat = e.sug; delete e.sug; e.updated = now; });
    save(); render(); burst('#ffcc66', `${list.length} classified`); toast(`${list.length} days classified. Change any one by tapping it and choosing Edit.`); }),
  gounc: () => { UI.f = {cat:'unc', sub:null, yr:null, q:'', sort:'old'}; UI.tab = 'list'; render(); scrollTo(0,0); },
  /* calendar */
  calmode: el => { UI.calMode = el.dataset.v; render(); },
  calnav: el => { UI.calM = new Date(UI.calM.getFullYear(), UI.calM.getMonth() + +el.dataset.v, 1); render(); },
  caltoday: () => { UI.calM = null; UI.sel = today(); render(); },
  calday: el => { UI.sel = el.dataset.k; render(); const p = document.querySelector('.selhd'); if (p) p.scrollIntoView({behavior:'smooth', block:'nearest'}); },
  yrnav: el => { UI.yr = (UI.yr || +today().slice(0,4)) + +el.dataset.v; render(); },
  gomonth: el => { UI.calM = new Date(+el.dataset.y, +el.dataset.m, 1); UI.calMode = 'month'; render(); },
  /* list */
  fcatf: el => { UI.f.cat = el.dataset.v; UI.f.sub = null; render(); },
  fsub: el => { UI.f.sub = UI.f.sub === el.dataset.v ? null : el.dataset.v; render(); },
  fyr: el => { UI.f.yr = UI.f.yr === el.dataset.v ? null : el.dataset.v; render(); },
  fsort: el => { UI.f.sort = el.dataset.v; render(); },
  fclear: () => { UI.f = {cat:'all', sub:null, yr:null, q:'', sort:'new'}; render(); },
  gocat: el => { UI.f = {cat:el.dataset.v, sub:null, yr:null, q:'', sort:'new'}; UI.tab = 'list'; render(); scrollTo(0,0); },
  /* settings */
  settings: () => sheetSettings(),
  bioon: async () => { try { await bioRegister(); closeSheet(); toast('Fingerprint unlock is on'); } catch(e) { toast('Fingerprint setup was cancelled or isn\'t available here'); } },
  bioff: () => { L.cred = null; saveL(); sheetSettings(); toast('Fingerprint unlock turned off. Your PIN still works.'); },
  grace: el => { L.grace = +el.dataset.v; saveL(); sheetSettings(); },
  chpin: () => { LK.next = 'change1'; showLock('change1'); },
  newcat: () => { readF(); UI.returnEdit = UI.inSheet; sheetCat(null); },
  editcat: el => sheetCat(catOf(el.dataset.id)),
  catsw: el => { UI.catEdit.color = el.dataset.c; document.querySelectorAll('.sheet .sw button').forEach(b => b.classList.toggle('on', b === el)); },
  savecat: () => { const c = UI.catEdit; c.name = $('cName').value.trim(); if (!c.name) return toast('Give it a name');
    const {isNew, ...cat} = c; if (isNew) S.cats.push(cat); else S.cats = S.cats.map(x => x.id === cat.id ? cat : x); save(); closeSheet();
    if (isNew && UI.F) { UI.F.cat = cat.id; UI.F.sub = ''; } if (UI.returnEdit && UI.F) { UI.inSheet = true; sheet(`<h3>Edit day</h3>${formBody(UI.F)}`); } else render(); },
  delcat: el => arm(el, () => { const id = UI.catEdit.id; S.cats = S.cats.filter(x => x.id !== id); S.entries.forEach(e => { if (e.cat === id) e.cat = null; }); save(); closeSheet(); render(); toast('Category deleted'); }),
  import: () => $('fileIn').click(),
  export: () => { const blob = new Blob([JSON.stringify({...S, app:'VID', kind:'backup'}, null, 1)], {type:'application/json'}), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `vid-backup-${today()}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1500); },
  wipe: el => arm(el, () => { try { localStorage.removeItem(KEY); localStorage.removeItem(LKEY); } catch(e) {} S = fresh(); L = {pinHash:null, salt:null, cred:null, grace:1}; closeSheet(); unlocked = false; showLock('setup1'); }),
  close: () => closeSheet(),
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (!el || $('app').hidden && !el.closest('.sheet')) return; const f = A[el.dataset.act]; if (f) f(el, e); });
document.addEventListener('input', e => {
  if (e.target.id === 'q') { UI.f.q = e.target.value; $('jlist').innerHTML = listBody(); }
  if (e.target.id === 'pkQ') { PK.q = e.target.value; pkRefresh(); }
  if (e.target.id === 'fDate' && $('fEnd')) $('fEnd').min = e.target.value;
});
document.addEventListener('keydown', e => { if (e.target.id === 'pkQ' && e.key === 'Enter') { e.preventDefault(); const f = document.querySelector('#pkList [data-act=pkchoose]'); if (PK.q.trim() && f && f.dataset.v) A.pkchoose(f); else A.pkadd(); } });

/* ===================== start ===================== */
function seedDemo(){
  const t = today(), y = +t.slice(0,4), md0 = t.slice(5);
  const S0 = [[y-3, md0, 'family', 'Celebration', 'First family trip to the hills', 4], [y-1, md0, 'investment', 'Milestone', 'Portfolio crossed a big round number', 5], [y-2, md0, 'fitness', 'PR', 'First 100 kg squat', 3],
    [y, '01-01', 'personal', 'Lesson', 'New year, new habits', 2], [y-1, '08-23', 'family', 'Anniversary', 'Wedding anniversary dinner', 5], [y, '03-23', 'career', 'Exam', 'Cleared the written exam', 4],
    [y-1, '11-20', null, '', 'One of the best days of the year', 0, 'personal'], [y, '06-01', 'family', 'Home', 'Moved into the new house', 5], [y-2, '02-21', null, '', 'Started a new supplement', 0, 'fitness'], [y, '09-28', 'personal', 'Projects', 'Built three apps in two days', 4]];
  const now = Date.now();
  S0.forEach(([yy, m, cat, sub, text, stars, sug], i) => S.entries.push({id:'demo' + i, date:`${yy}-${m}`, cat, sub, text, stars, sug, created:now - i*86400000, updated:now - i*86400000, imported: !cat}));
  ['Celebration','Anniversary','Home'].forEach(v => (S.subs.family = S.subs.family || []).push(v));
}
(async function start(){
  if (window.VID_DEMO) { seedDemo(); L.salt = 'demo'; L.pinHash = await hashPin('123456', 'demo'); showLock('unlock'); return; }
  if (!L.pinHash) showLock('setup1'); else showLock('unlock');
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
})();
